services:
  db:
    image: postgres:15-alpine
    container_name: irannews-db
    environment:
      POSTGRES_DB: irannews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Le fichier init.sql est conservé dans son emplacement d'origine
      - ./src/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: irannews-php-app
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: irannews
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      # Montage en temps réel du dossier main pour le développement
      - ./main:/var/www/html/main
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
