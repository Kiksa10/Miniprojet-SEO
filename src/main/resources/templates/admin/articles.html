<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Articles - Administration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin">

<!-- Admin Navbar -->
<nav class="admin-navbar">
    <div class="container nav-content">
        <a href="/admin" class="logo">
            <span class="logo-icon">⚙️</span>
            <span class="logo-text">Iran<span class="logo-accent">News</span> <small>Admin</small></span>
        </a>
        <div class="nav-links">
            <a href="/admin" class="nav-link">Dashboard</a>
            <a href="/admin/articles" class="nav-link active">Articles</a>
            <a href="/admin/categories" class="nav-link">Catégories</a>
            <a href="/" class="nav-link" target="_blank">🌐 Voir le site</a>
            <a href="/admin/logout" class="nav-link nav-logout">Déconnexion</a>
        </div>
    </div>
</nav>

<main class="container admin-content">
    <div class="page-header">
        <h1>Gestion des articles</h1>
        <a href="/admin/articles/new" class="btn btn-primary">+ Nouvel article</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div th:if="${#lists.isEmpty(articles)}" class="empty-state">
        <p>Aucun article trouvé. Créez votre premier article !</p>
    </div>

    <div th:unless="${#lists.isEmpty(articles)}" class="table-responsive">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Titre</th>
                    <th>Statut</th>
                    <th>Vues</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="article : ${articles}">
                    <td th:text="${article.id}">1</td>
                    <td th:text="${article.title}">Titre</td>
                    <td>
                        <span class="status-badge" th:classappend="${article.status == 'PUBLISHED'} ? 'status-published' : 'status-draft'" th:text="${article.status}">DRAFT</span>
                    </td>
                    <td th:text="${article.viewCount}">0</td>
                    <td th:text="${#temporals.format(article.createdAt, 'dd/MM/yyyy')}">01/01/2025</td>
                    <td class="actions-cell">
                        <a th:href="@{/admin/articles/edit/{id}(id=${article.id})}" class="btn btn-sm btn-edit" title="Modifier">✏️</a>
                        <a th:if="${article.status == 'DRAFT'}" th:href="@{/admin/articles/publish/{id}(id=${article.id})}" class="btn btn-sm btn-publish" title="Publier">✅</a>
                        <a th:if="${article.status == 'PUBLISHED'}" th:href="@{/admin/articles/unpublish/{id}(id=${article.id})}" class="btn btn-sm btn-unpublish" title="Dépublier">⏸️</a>
                        <a th:href="@{/admin/articles/delete/{id}(id=${article.id})}" class="btn btn-sm btn-delete" title="Supprimer" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet article ?')">🗑️</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
