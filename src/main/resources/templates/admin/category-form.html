<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Catégorie - Administration</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="admin">

<!-- Admin Navbar -->
<nav class="admin-navbar">
    <div class="container nav-content">
        <a href="/admin" class="logo">
            <span class="logo-icon">⚙️</span>
            <span class="logo-text">Iran<span class="logo-accent">News</span> <small>Admin</small></span>
        </a>
        <div class="nav-links">
            <a href="/admin" class="nav-link">Dashboard</a>
            <a href="/admin/articles" class="nav-link">Articles</a>
            <a href="/admin/categories" class="nav-link active">Catégories</a>
            <a href="/" class="nav-link" target="_blank">🌐 Voir le site</a>
            <a href="/admin/logout" class="nav-link nav-logout">Déconnexion</a>
        </div>
    </div>
</nav>

<main class="container admin-content">
    <div class="page-header">
        <h1 th:text="${category.id != null} ? 'Modifier la catégorie' : 'Nouvelle catégorie'">Nouvelle catégorie</h1>
        <a href="/admin/categories" class="btn btn-secondary">← Retour</a>
    </div>

    <form th:action="@{/admin/categories/save}" method="post" th:object="${category}" class="admin-form">
        <input type="hidden" th:field="*{id}">

        <div class="form-group">
            <label for="name">Nom *</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Nom de la catégorie" required>
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="4" placeholder="Description de la catégorie"></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">💾 Sauvegarder</button>
            <a href="/admin/categories" class="btn btn-secondary">Annuler</a>
        </div>
    </form>
</main>

</body>
</html>
